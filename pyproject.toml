[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "model-drift"
version = "0.1.0"
description = "Is My Model Drifting? A public LLM regression tracker: probe models on a frozen suite, store runs over time, flag regressions."
requires-python = ">=3.11"
dependencies = []
license = {text = "MIT"}

[project.optional-dependencies]
# PyYAML is a TEST dependency only, and runtime dependencies stay at zero.
# tests/test_confirm_gate.py reads draft.yml structurally, by step name and by the
# PR step's `if` condition, rather than grepping it, so that editing the workflow
# edits what the tests assert. Hand-rolling that parse would be worse than one dev
# dependency. It was missing on 2026-10-05 and CI failed at collection on 024b3ba:
# the tests passed locally only because the venv had yaml via something else, which
# is the local-does-not-match-CI trap.
dev = ["pytest>=7", "pyyaml>=6"]

[project.scripts]
model-drift = "modeldrift.run:main"

[tool.setuptools]
packages = ["modeldrift"]

[tool.setuptools.package-data]
modeldrift = ["models.json"]
