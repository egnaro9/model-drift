name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # track pushes the daily artifacts as GITHUB_TOKEN, and GitHub does not create
  # workflow runs from GITHUB_TOKEN events, so `push` above never fires for them.
  # `[skip ci]` on those commits is belt on top of that brace: removing it would
  # change nothing. workflow_run is not suppressed by either, which is how pages
  # already reaches every bot commit. Without this, the checks below have never
  # run on a single commit that changed the files they validate.
  workflow_run:
    workflows: [track]
    types: [completed]
    # Deliberately NOT filtered on conclusion == success: a run can fail after it
    # has pushed, and that is precisely when validating what landed still matters.

permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run.head_sha is the commit track checked out when it STARTED,
          # which is the commit before the artifacts it then committed. Validating
          # that sha would check the wrong tree and look like it worked. Take main's
          # current tip instead, as pages.yml does. Empty string keeps the default
          # for push and pull_request, so PR runs still validate the PR merge ref.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || '' }}
      - name: What is being validated, and why
        run: |
          echo "event            : ${{ github.event_name }}"
          echo "trigger head_sha : ${{ github.event.workflow_run.head_sha }}"
          echo "trigger result   : ${{ github.event.workflow_run.conclusion }}"
          echo "checked out      : $(git rev-parse HEAD)"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: The probe runs end to end on the mock (no keys, no spend)
        run: python -m modeldrift.run | tee /dev/stderr | grep -q "acc 100%"
      - name: The identity check runs end to end on the mock (no keys, no spend)
        run: python -m modeldrift.identity | tee /dev/stderr | grep -q "0 mismatch"

  # The VAC bundle's freshness gate: regenerate-and-diff, in THIS job. Never a
  # second triggered workflow — GITHUB_TOKEN pushes don't trigger workflows,
  # which is exactly how this board has published stale before. The bundle is a
  # frozen snapshot of one standings commit, so it is re-derived at its OWN
  # stamped commit (not at HEAD, where the daily data has moved on) and must
  # come back byte-identical; `diff -r` also fails on any file the emitter
  # would not write, keeping the committed bundle closed.
  vac-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the stamped commit must be reachable
          ref: ${{ github.event_name == 'workflow_run' && 'main' || '' }}
      - name: What is being validated, and why
        run: |
          echo "event            : ${{ github.event_name }}"
          echo "trigger head_sha : ${{ github.event.workflow_run.head_sha }}"
          echo "trigger result   : ${{ github.event.workflow_run.conclusion }}"
          echo "checked out      : $(git rev-parse HEAD)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Re-emit the bundle at its stamped commit; demand byte-identity
        run: |
          stamp=$(python3 -c "import json; print(json.load(open('vac/vac.json'))['protocol']['issuer_commit'])")
          git worktree add "$RUNNER_TEMP/at-stamp" "$stamp"
          ( cd "$RUNNER_TEMP/at-stamp" && python3 emit_vac.py )
          diff -r "$RUNNER_TEMP/at-stamp/vac" vac
      - name: The committed narrative re-derives from the committed rows at HEAD
        run: |
          python3 -m modeldrift.narrative --metrics dashboard/drift_board.json --out "$RUNNER_TEMP/narrative.json"
          cmp "$RUNNER_TEMP/narrative.json" dashboard/narrative.json
      - name: The committed standings re-render from the committed rows at HEAD
        run: |
          python3 - <<'EOF'
          import json, pathlib, sys
          sys.path.insert(0, ".")
          from modeldrift.board import results_md_offline
          series = json.loads(pathlib.Path("dashboard/drift_board.json").read_text())["series"]
          registry = json.loads(pathlib.Path("modeldrift/models.json").read_text())
          committed = pathlib.Path("RESULTS.md").read_text()
          if results_md_offline(series, registry) != committed:
              sys.exit("RESULTS.md no longer re-renders from dashboard/drift_board.json "
                       "— the board's two stores (eval-history and the committed "
                       "rows) have diverged; diagnose which one is lying")
          EOF
