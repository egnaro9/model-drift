name: list-models
on: workflow_dispatch
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - name: What models does each key actually expose?
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m modeldrift.run --list-models
      - name: Does Groq serve a model its listing omits?
        # The listing endpoint is not the endpoint we call. Groq documents
        # llama-3.3-70b-versatile as NOT deprecated while omitting it from this
        # key's /models response, so ask the chat endpoint directly. Bearer auth
        # and a status-only read: no key can reach the log.
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          for m in llama-3.3-70b-versatile llama-3.1-8b-instant \
                   meta-llama/llama-4-scout-17b-16e-instruct \
                   openai/gpt-oss-120b qwen/qwen3.8-27b; do
            code=$(curl -s -o /tmp/body.json -w '%{http_code}' \
              https://api.groq.com/openai/v1/chat/completions \
              -H "Authorization: Bearer $GROQ_API_KEY" \
              -H 'Content-Type: application/json' \
              -d "{\"model\":\"$m\",\"max_tokens\":1,\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}]}")
            echo "PROBE $code  $m  $(head -c 200 /tmp/body.json | tr -d '\n')"
          done
      - name: What do the models actually answer on the factual-recall tasks?
        # The board records WHICH tasks failed, never what the model said, so a
        # systematic grading failure cannot be diagnosed from the record. Nine
        # calls through the probe's own call path, printing repr() so trailing
        # punctuation, markdown and whitespace are visible rather than implied.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python - <<'PY'
          from modeldrift.providers import call_meta, load_registry
          from modeldrift.suite import SUITE
          want = {"fact-element", "fact-capital", "fact-planet",
                  "float-subtract", "math-order", "math-percent", "unit-minutes"}
          tasks = [t for t in SUITE if t.id in want]
          ids = {"anthropic:claude-sonnet-5", "openai:gpt-4o-mini", "anthropic:claude-opus-4-8"}
          for m in load_registry():
              if m.id not in ids or not m.available:
                  continue
              for t in tasks:
                  try:
                      out, finish = call_meta(m, t.prompt, task_id=t.id)
                      print(f"ANSWER {m.id:28} {t.id:14} graded={t.grade(out)!s:5} {out!r}")
                  except Exception as e:
                      print(f"ANSWER {m.id:28} {t.id:14} ERROR {type(e).__name__}: {str(e)[:120]}")
          PY
