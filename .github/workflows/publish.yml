name: publish
# Publish the week's drift note without needing Erik's laptop awake.
#
# This replaces five one-shot scheduled tasks that ran on his Mac. Those do not
# fire while the machine is asleep: measured, 8 of 110 expected inbox-triage
# runs and 6 of 168 promptfoo runs simply never happened. A weekly post that
# silently skips a week is the failure this exists to remove.
#
# It publishes in a fixed order and REFUSES to cross-post until the canonical
# url is live, because the dev.to article carries that url and a canonical that
# 404s tells search engines the real article is somewhere it is not. That
# happened on 2026-09-23 to two already published notes.
on:
  schedule:
    - cron: "4 12 * * *"        # DAILY 12:04 UTC = 8:04 ET. Off the hour on purpose.
    # Daily, because the front-matter DATE is the schedule. --pick only returns a
    # draft whose date has arrived, so a post publishes on its own date and a
    # quiet day is a no-op that exits in seconds. A Wednesday-only cron silently
    # could not run the 2026-10-02 cadence test, which falls on a Friday.
  workflow_dispatch:
    inputs:
      slug:
        description: "Publish this slug specifically. Leave blank to take the oldest due draft."
        required: false
      dry_run:
        description: "true = report what would happen and change nothing"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"

      # ONE post per week, and it is measured rather than a preference: the
      # 2026-08-14 double launch got under 25 views each and zero comments,
      # while the same topic alone five days earlier got 48 views and 5.
      - name: Choose the post
        id: pick
        run: python -m modeldrift.publish --pick --posts posts --slug "${{ inputs.slug }}"

      # ONE post per week, unless the POST ITSELF declares an exception. The rule
      # is measured and worth keeping; it is also not a law of nature, and an
      # experiment that needs two posts close together must be able to say so in
      # a way a reader of the repo can audit. The exception lives in the post's
      # front matter, not in a workflow input, so it cannot be waved through at
      # dispatch time and leaves a permanent record next to the claim it enables.
      #
      # A post that has to wait for the window is DEFERRED, not failed. It used to
      # exit 1, which turned the job red every day a due draft waited (2026-10-07
      # and 10-08) for a rule doing exactly what it was built to do. Red now means
      # something broke; a wait is a warning and the summary says when it clears.
      - name: One post per week, unless this one is a declared exception
        id: cadence
        if: steps.pick.outputs.slug != ''
        run: |
          set -euo pipefail
          recent=$(git log --since="6 days ago" --format=%s -- posts/ | grep -c '^publish:' || true)
          echo "posts published in the last 6 days: $recent"
          slug='${{ steps.pick.outputs.slug }}'
          if [ "$recent" = "0" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif grep -qE '^cadence_exception:[[:space:]]*\S' "posts/$slug.md"; then
            echo "::warning::Publishing inside the weekly window by declared exception:"
            grep -E '^cadence_exception:' "posts/$slug.md"
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$slug is due but a post went out in the last 6 days. Deferred, not"
            echo "::warning::failed: a later run publishes it once the window clears. Add a"
            echo "::warning::cadence_exception line to the post if it must go out sooner."
            {
              echo "### Deferred: $slug"
              echo ""
              echo "A post went out in the last 6 days, so this waits for the weekly window."
              echo "His 2026-08-14 double launch got under 25 views each at T+24h; the same"
              echo "topic alone five days earlier got 48."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Nothing is due
        if: steps.pick.outputs.slug == ''
        run: |
          echo "### Nothing due this week" >> "$GITHUB_STEP_SUMMARY"
          echo "No staged note has a date on or before today. A quiet week is a result." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish on the site
        if: steps.cadence.outputs.go == 'true' && inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          slug='${{ steps.pick.outputs.slug }}'
          python - "$slug" <<'PY'
          import pathlib, sys, re
          p = pathlib.Path(f"posts/{sys.argv[1]}.md"); s = p.read_text()
          assert re.search(r"^status:\s*draft\s*$", s, re.M), "not a draft; refusing"
          p.write_text(re.sub(r"^status:\s*draft\s*$", "status: published", s, count=1, flags=re.M))
          PY
          python -m modeldrift.publish --posts posts --out posts/index.json
          pytest -q
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts
          git commit -m "publish: $slug"
          git push

      # The site repo's notes workflow is scheduled four times an hour, but GitHub
      # delivers a fraction of scheduled runs: on 2026-10-09 and 2026-10-14 the next
      # site build came hours later, this timed out, and with no retry both
      # cross-posts were simply lost. The refusal stays (a dead canonical is worse
      # than a late post); the red goes. On timeout this hands off to crosspost.yml,
      # which publishes once the page is up and turns red only if it never appears.
      - name: GATE, wait for the canonical to be live
        id: gate
        if: steps.cadence.outputs.go == 'true' && inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          url="https://erikhill.dev/notes/${{ steps.pick.outputs.slug }}/"
          echo "waiting for $url"
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            echo "  attempt $i: $code"
            if [ "$code" = "200" ]; then echo "live=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 30
          done
          echo "live=false" >> "$GITHUB_OUTPUT"
          echo "::warning::$url is not live after 30 minutes. Nothing was cross-posted yet."
          echo "::warning::crosspost.yml publishes it once the page is up, and goes red if the"
          echo "::warning::page is still missing 48 hours after the note's date."
          {
            echo "### Published on the repo, cross-post pending: ${{ steps.pick.outputs.slug }}"
            echo ""
            echo "The site had not built the page within 30 minutes. crosspost.yml retries."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cross-post to dev.to
        if: steps.gate.outputs.live == 'true' && inputs.dry_run != 'true'
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: python tools/devto_publish.py --slug "${{ steps.pick.outputs.slug }}"

      - name: Hand LinkedIn back to Erik
        if: steps.gate.outputs.live == 'true' && inputs.dry_run != 'true'
        run: |
          slug='${{ steps.pick.outputs.slug }}'
          {
            echo "## Published: $slug"
            echo ""
            echo "- https://erikhill.dev/notes/$slug/"
            echo ""
            echo "### Paste this into the Drift Notes newsletter"
            echo ""
            echo '```'
            cat "posts/staged/$slug.linkedin.txt" 2>/dev/null || echo "(no staged linkedin text)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
